version: "20250606150649"
name: create_candlesticks_table

table: clickhouse.candlesticks

development: &development
  up: |
    CREATE TABLE IF NOT EXISTS {table} (
      ticker String,

      open Float64,
      high Float64,
      low Float64,
      close Float64,

      datetime DateTime,

      interval String,

      exchange String
    ) ENGINE = MergeTree()
    PARTITION BY
      toYYYYMMDD(datetime)
    ORDER BY
      datetime;
  down: |
    DROP TABLE IF EXISTS {table};

test:
  <<: *development
