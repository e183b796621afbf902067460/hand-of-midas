version: "20250606150649"
name: create_candlesticks_table

table: clickhouse.candlesticks

development: &development
  up: |
    CREATE TABLE IF NOT EXISTS {table} (

      exchange String,
      section String,

      ticker String,
      interval String,

      open Float64,
      high Float64,
      low Float64,
      close Float64,

      open_time DateTime,
      close_time DateTime

    ) ENGINE = MergeTree()
    PARTITION BY (
      exchange,
      section,
      ticker,
      interval
    )
    ORDER BY (
      exchange,
      section,
      ticker,
      interval,
      open_time,
      close_time
    );
  down: |
    DROP TABLE IF EXISTS {table};

test:
  <<: *development
